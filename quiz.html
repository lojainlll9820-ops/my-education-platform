<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نمط - اختبر فهمك</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eee5ff, #d9c4ff);
            color: #4b3566;
            min-height: 100vh;
        }

        .language-switch {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 20;
        }

        .language-switch button {
            border: none;
            background: white;
            color: #684094;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(82, 48, 120, 0.12);
            transition: 0.2s;
        }

        .language-switch button:hover {
            transform: translateY(-2px);
        }

        .page {
            min-height: 100vh;
            padding: 40px 25px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 42px;
            color: #5b3b82;
        }

        .header p {
            font-size: 19px;
            color: #70578c;
            margin-top: 15px;
        }

        .box {
            background: rgba(255, 255, 255, 0.88);
            border-radius: 30px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(90, 55, 130, 0.12);
        }

        .box h2 {
            text-align: center;
            color: #5b3b82;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .subject {
            background: #f4edff;
            border-radius: 24px;
            padding: 25px 15px;
            text-align: center;
            color: #5b3b82;
            cursor: pointer;
            border: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .subject:hover {
            transform: translateY(-6px);
            background: #e9dbfa;
        }

        .subject-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .info {
            margin-top: 30px;
            background: #f4edff;
            border-radius: 22px;
            padding: 20px;
            text-align: center;
            color: #6b5085;
            font-size: 17px;
            line-height: 1.8;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 25px;
            background: #7952a8;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        @media (max-width: 750px) {

            .subjects {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 34px;
            }

        }

        @media (max-width: 500px) {

            .subjects {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="language-switch">
        <button id="languageButton" onclick="toggleLanguage()">
            🌐 English
        </button>
    </div>

    <div class="page">

        <div class="container">

            <div class="header">

                <h1 id="mainTitle">اختبر فهمك 🎯</h1>

                <p id="mainText">
                    اختبر فهمك، واكتشف نقاط قوتك وما يحتاج إلى مزيد من التدريب
                </p>

            </div>


            <div class="box">

                <h2 id="sectionTitle">
                    اختيار المادة التي تريد اختبار فهمك فيها
                </h2>


                <div class="subjects">

                    <button class="subject">
                        <div class="subject-icon">➗</div>
                        <span id="mathText">الرياضيات</span>
                    </button>

                    <button class="subject">
                        <div class="subject-icon">🧪</div>
                        <span id="scienceText">العلوم</span>
                    </button>

                    <button class="subject">
                        <div class="subject-icon">📖</div>
                        <span id="arabicText">لغتي</span>
                    </button>

                    <button class="subject">
                        <div class="subject-icon">🇬🇧</div>
                        <span id="englishText">اللغة الإنجليزية</span>
                    </button>

                    <button class="subject">
                        <div class="subject-icon">🌍</div>
                        <span id="socialText">الدراسات الاجتماعية</span>
                    </button>

                    <button class="subject">
                        <div class="subject-icon">💻</div>
                        <span id="digitalText">المهارات الرقمية</span>
                    </button>

                </div>


                <div class="info" id="infoText">

                    💡 بعد اختيار المادة، يساعدك نمط على قياس فهمك
                    من خلال أسئلة وأنشطة قصيرة تناسب مستواك.

                </div>

            </div>


            <a href="home.html" class="back" id="backButton">
                ← العودة للرئيسية
            </a>

        </div>

    </div>


    <script>

        let isEnglish = false;

        function toggleLanguage() {

            isEnglish = !isEnglish;

            const button = document.getElementById("languageButton");

            if (isEnglish) {

                document.documentElement.lang = "en";
                document.documentElement.dir = "ltr";

                button.innerText = "🌐 العربية";

                document.getElementById("mainTitle").innerText =
                    "Test Your Understanding 🎯";

                document.getElementById("mainText").innerText =
                    "Test your understanding, discover your strengths, and find what needs more practice.";

                document.getElementById("sectionTitle").innerText =
                    "Choose the subject you want to test";

                document.getElementById("mathText").innerText =
                    "Mathematics";

                document.getElementById("scienceText").innerText =
                    "Science";

                document.getElementById("arabicText").innerText =
                    "Arabic";

                document.getElementById("englishText").innerText =
                    "English";

                document.getElementById("socialText").innerText =
                    "Social Studies";

                document.getElementById("digitalText").innerText =
                    "Digital Skills";

                document.getElementById("infoText").innerText =
                    "💡 After choosing a subject, Namat helps you measure your understanding through short questions and activities that suit your level.";

                document.getElementById("backButton").innerText =
                    "← Back to Home";

            } else {

                document.documentElement.lang = "ar";
                document.documentElement.dir = "rtl";

                button.innerText = "🌐 English";

                document.getElementById("mainTitle").innerText =
                    "اختبر فهمك 🎯";

                document.getElementById("mainText").innerText =
                    "اختبر فهمك، واكتشف نقاط قوتك وما يحتاج إلى مزيد من التدريب";

                document.getElementById("sectionTitle").innerText =
                    "اختيار المادة التي تريد اختبار فهمك فيها";

                document.getElementById("mathText").innerText =
                    "الرياضيات";

                document.getElementById("scienceText").innerText =
                    "العلوم";

                document.getElementById("arabicText").innerText =
                    "لغتي";

                document.getElementById("englishText").innerText =
                    "اللغة الإنجليزية";

                document.getElementById("socialText").innerText =
                    "الدراسات الاجتماعية";

                document.getElementById("digitalText").innerText =
                    "المهارات الرقمية";

                document.getElementById("infoText").innerText =
                    "💡 بعد اختيار المادة، يساعدك نمط على قياس فهمك من خلال أسئلة وأنشطة قصيرة تناسب مستواك.";

                document.getElementById("backButton").innerText =
                    "← العودة للرئيسية";

            }

        }

    </script>

</body>

</html>
