<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نمط</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eee5ff;
            overflow: hidden;
        }

        .language-switch {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 20;
        }

        .language-switch button {
            border: none;
            background: white;
            color: #684094;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(82, 48, 120, 0.12);
            transition: 0.2s;
        }

        .language-switch button:hover {
            transform: translateY(-2px);
        }

        .page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 30px;
        }

        /* اسم المنصة */

        h1 {
            margin: 0;
            font-size: 80px;
            color: #5b3b82;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* العبارة */

        p {
            margin-top: 18px;
            font-size: 25px;
            color: #70578c;
        }

        /* الزر */

        button {
            margin-top: 30px;
            padding: 15px 50px;
            border: none;
            border-radius: 30px;
            background: #7952a8;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(90, 55, 130, 0.2);
        }

        /* الدوائر */

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(100, 60, 150, 0.15);
        }

        .circle-one {
            width: 320px;
            height: 320px;
            top: -130px;
            right: -110px;
        }

        .circle-two {
            width: 220px;
            height: 220px;
            bottom: -90px;
            left: -70px;
        }

        .circle-three {
            width: 70px;
            height: 70px;
            top: 20%;
            left: 15%;
            background: rgba(130, 90, 180, 0.10);
            border: none;
        }

        .circle-four {
            width: 45px;
            height: 45px;
            bottom: 25%;
            right: 15%;
            background: rgba(130, 90, 180, 0.12);
            border: none;
        }

        /* النقاط */

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(100, 60, 150, 0.3);
            border-radius: 50%;
        }

        .dot-one {
            top: 18%;
            right: 25%;
        }

        .dot-two {
            bottom: 20%;
            left: 25%;
        }

        .dot-three {
            top: 35%;
            right: 10%;
        }

        .start-button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 50px;
            border: none;
            border-radius: 30px;
            background: #7952a8;
            color: white;
            font-size: 20px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(90, 55, 130, 0.2);
        }

    </style>

</head>

<body>

    <div class="language-switch">
        <button id="languageButton" onclick="toggleLanguage()">
            🌐 English
        </button>
    </div>

    <div class="page">

        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>
        <div class="circle circle-four"></div>

        <div class="dot dot-one"></div>
        <div class="dot dot-two"></div>
        <div class="dot dot-three"></div>

        <h1>نمط</h1>

        <p id="mainText">
            مساعدك الذكي لفهمٍ أعمق وتعلّمٍ أفضل
        </p>

        <a href="home.html" class="start-button" id="startButton">
            ابدأ الآن
        </a>

    </div>


    <script>

        let isEnglish = false;

        function toggleLanguage() {

            isEnglish = !isEnglish;

            const button = document.getElementById("languageButton");

            if (isEnglish) {

                document.documentElement.lang = "en";
                document.documentElement.dir = "ltr";

                button.innerText = "🌐 العربية";

                document.getElementById("mainText").innerText =
                    "Your smart assistant for deeper understanding and better learning";

                document.getElementById("startButton").innerText =
                    "Get Started";

            } else {

                document.documentElement.lang = "ar";
                document.documentElement.dir = "rtl";

                button.innerText = "🌐 English";

                document.getElementById("mainText").innerText =
                    "مساعدك الذكي لفهمٍ أعمق وتعلّمٍ أفضل";

                document.getElementById("startButton").innerText =
                    "ابدأ الآن";

            }

        }

    </script>

</body>

</html>
